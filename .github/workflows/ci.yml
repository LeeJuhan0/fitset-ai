name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (poetry.lock 고정 버전)
        run: |
          pip install "poetry==2.5.1"
          poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest
