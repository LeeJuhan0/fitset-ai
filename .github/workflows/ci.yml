name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 루틴 검색 테스트용 pgvector. PG_TEST_DSN 이 없으면 pg_schema 를 쓰는 테스트만 skip 된다.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fitset
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d fitset"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PG_TEST_DSN: postgresql+psycopg://admin:test@localhost:5432/fitset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (poetry.lock 고정 버전)
        run: |
          pip install "poetry==2.5.1"
          poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest
