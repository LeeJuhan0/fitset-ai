name: CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: cd-fitset-ai-server
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 로 AWS 역할 assume
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: fitset-ai-server
  EKS_CLUSTER: fitset
  K8S_NAMESPACE: fitset-dev
  DEV_HOST: api-dev.fitset.kro.kr

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 소요 시간 측정 시작
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729743892772:role/fitset-ai-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 같은 커밋으로 다시 돌릴 때(workflow_dispatch) 이미 올라간 태그를 덮어쓰려다
      # immutable tag 로 실패한다. 있으면 빌드를 건너뛰고 배포만 한다.
      - name: Check image exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이미 올라간 이미지다 — 빌드를 건너뛴다"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push image
        if: steps.exists.outputs.found == 'false'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # 태그는 커밋 SHA 만 단다. latest 처럼 움직이는 태그를 쓰면
          # 박스에 떠 있는 이미지가 어느 커밋인지 되짚을 수 없다.
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: 이미지 단계 종료 시각
        id: timer-build
        if: always()
        run: echo "built=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to EKS
        id: deploy
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

          # 레포의 매니페스트는 IMAGE_TAG 자리표시자로 두고, 배포할 때만 커밋 SHA 로 채운다.
          OVERLAY=deploy/k8s/overlays/dev
          sed -i "s/IMAGE_TAG/${{ github.sha }}/g" "$OVERLAY/kustomization.yaml" "$OVERLAY/patch-deployment.yaml"
          kubectl apply -k "$OVERLAY"

      - name: Wait for rollout
        id: rollout
        run: |
          # 새 파드가 readiness 를 통과해야 옛 파드가 내려간다(maxUnavailable 0).
          # 5분 안에 안 되면 원인을 남기고 이전 ReplicaSet 으로 되돌린다.
          if kubectl -n "$K8S_NAMESPACE" rollout status deployment/fitset-ai-server --timeout=5m; then
            exit 0
          fi
          kubectl -n "$K8S_NAMESPACE" describe deployment/fitset-ai-server | tail -30 || true
          kubectl -n "$K8S_NAMESPACE" get pods -l app=fitset-ai-server -o wide || true
          kubectl -n "$K8S_NAMESPACE" logs -l app=fitset-ai-server --tail=100 --all-containers --prefix || true
          kubectl -n "$K8S_NAMESPACE" get events --sort-by=.lastTimestamp | tail -20 || true
          kubectl -n "$K8S_NAMESPACE" rollout undo deployment/fitset-ai-server || true
          exit 1

      - name: Verify through ALB
        run: |
          # ALB 타깃이 healthy 로 바뀌기까지 헬스체크가 두 번(15초 간격) 더 돌아야 한다.
          # 인증이 걸린 경로면 401·403 이 나오는데 그것도 응답하고 있다는 증거다.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$DEV_HOST/ai/v1/health" || echo 000)
            echo "시도 $i: $CODE"
            case "$CODE" in
              000|5*) sleep 10 ;;
              *) echo "ALB 를 통해 응답을 받았다 ($CODE)"; exit 0 ;;
            esac
          done
          echo "::error::ALB 를 통한 확인에 실패했다"
          exit 1

      - name: 핏봇 배포 결과 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          START_TS: ${{ steps.timer.outputs.start }}
          BUILT_TS: ${{ steps.timer-build.outputs.built }}
          SERVICE: ai-chat-api
          TARGET_URL: https://api-dev.fitset.kro.kr/ai/v1
          FAILED_STEP: ${{ steps.deploy.outcome == 'failure' && 'EKS 배포' || steps.rollout.outcome == 'failure' && '롤아웃(자동 롤백됨)' || steps.exists.outcome == 'failure' && '이미지 확인' || '이미지 빌드·검증' }}
        run: |
          # 웹훅이 없는 레포에서 배포 자체를 실패로 만들지 않는다.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 생략"
            exit 0
          fi

          fmt() {  # 초 → "8분 11초"
            if [ "$1" -lt 60 ]; then printf '%d초' "$1"; else printf '%d분 %d초' $(( $1 / 60 )) $(( $1 % 60 )); fi
          }
          NOW=$(date +%s)
          START=${START_TS:-$NOW}
          TOTAL=$(fmt $(( NOW - START )))

          # 빌드 전에 깨지면 단계별 내역 자체가 없다.
          BREAKDOWN=""
          if [ -n "$BUILT_TS" ]; then
            BREAKDOWN="이미지 빌드 $(fmt $(( BUILT_TS - START )))"
            if [ "$NOW" -gt "$BUILT_TS" ]; then
              BREAKDOWN="$BREAKDOWN  ·  배포 $(fmt $(( NOW - BUILT_TS )))"
            fi
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI=":rocket:"; HEADLINE="배포 성공"; COLOR="#2eb886"; STAGE=""
          else
            EMOJI=":rotating_light:"; HEADLINE="배포 실패"; COLOR="#d73a4a"; STAGE="$FAILED_STEP"
          fi

          jq -n \
            --arg emoji "$EMOJI" --arg headline "$HEADLINE" --arg color "$COLOR" \
            --arg service "$SERVICE" --arg subject "$(git log -1 --pretty=%s)" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --arg shaurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --arg runurl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg actor "$GITHUB_ACTOR" --arg total "$TOTAL" --arg breakdown "$BREAKDOWN" \
            --arg target "$TARGET_URL" --arg branch "$GITHUB_REF_NAME" \
            --arg run "$GITHUB_RUN_NUMBER" --arg stage "$STAGE" \
            '
            def field($label; $value): { type: "mrkdwn", text: ("*" + $label + "*\n" + $value) };
            {
              text: ($headline + " — " + $service + " " + $sha + " (" + $total + ")"),
              attachments: [{
                color: $color,
                blocks: [
                  { type: "header",
                    text: { type: "plain_text", text: ($emoji + " " + $headline + " · " + $service), emoji: true } },
                  { type: "section",
                    text: { type: "mrkdwn", text: ("<" + $shaurl + "|`" + $sha + "`>  " + $subject) } },
                  { type: "section",
                    fields: ( [ field("소요 시간"; $total), field("이미지 태그"; $sha) ]
                              + (if $breakdown == "" then [] else [ field("단계별"; $breakdown) ] end)
                              + (if $stage == "" then [ field("주소"; $target) ] else [ field("실패 단계"; $stage) ] end)
                              + [ field("배포자"; $actor) ] ) },
                  { type: "actions",
                    elements: [ { type: "button",
                                  text: { type: "plain_text", text: "실행 로그 보기" },
                                  url: $runurl } ] },
                  { type: "context",
                    elements: [ { type: "mrkdwn", text: ("`" + $branch + "` 브랜치  ·  실행 #" + $run) } ] }
                ]
              }]
            }' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
