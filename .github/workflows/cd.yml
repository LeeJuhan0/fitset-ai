name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-fitset-ai-server
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC 로 AWS 역할 assume (ECR push 전용)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: fitset-ai-server

# ECR push 까지만 한다. 배포는 fitset-infra 의 values-{env}.yaml image.tag 를 ArgoCD 가 반영한다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::729743892772:role/fitset-ai-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (amd64, tagged by commit SHA)
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          LATEST="$REGISTRY/$ECR_REPOSITORY:latest"
          docker build --platform linux/amd64 -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

