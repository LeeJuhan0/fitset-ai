[project]
name = "fitset-ai-server"
version = "0.1.0"
description = "FitSet AI 백엔드 — AI 채팅과 루틴 생성·추천 (FastAPI)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "numpy>=2.0",
    "langgraph>=1.2.10",
    "langchain-core>=1.5.2",
    "langchain-aws>=1.6.4",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pynamodb>=6.0",
    "alembic>=1.16",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.24"
moto = ">=5.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
