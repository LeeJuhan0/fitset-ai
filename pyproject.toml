[project]
name = "fitset-ai-server"
version = "0.1.0"
description = "FitSet AI 백엔드 — AI 채팅과 루틴 생성·추천 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "numpy>=2.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-aws>=0.2",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.52",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "moto>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
