apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fitset-ai-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm
    kind: SecretStore
  target:
    name: fitset-ai-server
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: /fitset/dev/pg/password
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: /fitset/dev/ai/mysql-password
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /fitset/dev/ai/sentry-dsn
    - secretKey: SLACK_ERROR_WEBHOOK_URL
      remoteRef:
        key: /fitset/dev/slack/error-webhook-url
