apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fitset-ai-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm
    kind: SecretStore
  target:
    name: fitset-ai-server
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: /fitset/prod/pg/password
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: /fitset/prod/ai/mysql-password
    - secretKey: SENTRY_DSN
      remoteRef:
        key: /fitset/prod/ai/sentry-dsn
    # routines-sync Job 이 dev pgvector 를 읽을 때 쓰는 dev 비밀번호 사본
    - secretKey: SYNC_SOURCE_PG_PASSWORD
      remoteRef:
        key: /fitset/prod/ai/dev-pg-password
    - secretKey: SLACK_ERROR_WEBHOOK_URL
      remoteRef:
        key: /fitset/prod/slack/error-webhook-url
    - secretKey: CHAT_ENCRYPTION_KEYS
      remoteRef:
        key: /fitset/prod/ai/chat-encryption-keys
