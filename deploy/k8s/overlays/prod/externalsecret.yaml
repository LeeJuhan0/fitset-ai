apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fitset-ai-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssm
    kind: SecretStore
  target:
    name: fitset-ai-server
  data:
    - secretKey: PG_PASSWORD
      remoteRef:
        key: /fitset/prod/pg/password
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: /fitset/prod/ai/mysql-password
